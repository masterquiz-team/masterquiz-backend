databaseChangeLog:
  - changeSet:
      id: 07-create-quiz-attempt-table
      author: PatrykWski
      changes:
        - createTable:
            tableName: quiz_attempts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: quiz_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: started_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: finished_at
                  type: TIMESTAMP

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: quiz_attempts
            baseColumnNames: quiz_id
            referencedTableName: quizzes
            referencedColumnNames: id
            constraintName: fk_quiz_attempt_quiz

        - addForeignKeyConstraint:
            baseTableName: quiz_attempts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_quiz_attempt_user