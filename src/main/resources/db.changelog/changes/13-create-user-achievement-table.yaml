databaseChangeLog:
  - changeSet:
      id: 13-create-user-achievement-table
      author: PatrykWski
      changes:
        - createTable:
            tableName: user_achievements
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: achievement_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: unlocked_at
                  type: DATETIME
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_achievements
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_achievements_user

        - addForeignKeyConstraint:
            baseTableName: user_achievements
            baseColumnNames: achievement_id
            referencedTableName: achievements
            referencedColumnNames: id
            constraintName: fk_user_achievements_achievement

        - addUniqueConstraint:
            tableName: user_achievements
            columnNames: user_id, achievement_id
            constraintName: uk_user_achievement