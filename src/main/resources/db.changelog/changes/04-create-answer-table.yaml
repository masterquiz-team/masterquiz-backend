databaseChangeLog:
  - changeSet:
      id: 04-create-answer-table
      author: PatrykWski
      changes:
        - createTable:
            tableName: answers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: correct
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: question_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_answer_question
                    referencedTableName: questions
                    referencedColumnNames: id